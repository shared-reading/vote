name: Auto Update FB Likes

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # We need permission to commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install playwright

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run FB Scraper Script
        run: node scripts/auto-update.js
        
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Only commit if app.js changed
          if git diff --exit-code app.js; then
            echo "No changes detected in app.js"
          else
            git add app.js
            git commit -m "auto: update FB likes from scraper"
            git push
          fi
